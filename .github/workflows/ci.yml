name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Also validates the predefined-actions JSON files, which the extension reads live from main.
      - name: Test
        run: npm test

      # With CI=true, Create React App fails the build on lint warnings, so this also gates linting.
      - name: Build
        run: npm run build
